resources:
  Conditions:
    IsProduction:
      Fn::Equals:
        - ${sls:stage}
        - prod

  Resources:
    SurveyTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:custom.survey_table_name}
        DeletionProtectionEnabled:
          Fn::If:
            - IsProduction
            - true
            - false
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: gsi1PK
            AttributeType: S
          - AttributeName: gsi1SK
            AttributeType: S
          - AttributeName: gsi2PK
            AttributeType: S
          - AttributeName: gsi2SK
            AttributeType: S
          - AttributeName: entity_type
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: IDXinv
            KeySchema:
              - AttributeName: SK
                KeyType: HASH
              - AttributeName: PK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: gsi1
            KeySchema:
              - AttributeName: gsi1PK
                KeyType: HASH
              - AttributeName: gsi1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: gsi1inv
            KeySchema:
              - AttributeName: gsi1SK
                KeyType: HASH
              - AttributeName: gsi1PK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: gsi2
            KeySchema:
              - AttributeName: gsi2PK
                KeyType: HASH
              - AttributeName: gsi2SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: gsi2inv
            KeySchema:
              - AttributeName: gsi2SK
                KeyType: HASH
              - AttributeName: gsi2PK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: typeIDX
            KeySchema:
              - AttributeName: entity_type
                KeyType: HASH
              - AttributeName: PK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled:
            Fn::If:
              - IsProduction
              - true
              - false
        SSESpecification:
          SSEEnabled: true
        Tags:
          - Key: STAGE
            Value: ${sls:stage}
          - Key: DanceEngineVersion
            Value: v2

    SurveyApplicationRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: "${sls:stage}-sbk-survey-application"
        Description: Allows the Vercel SBK survey application to store contacts and survey responses.
        MaxSessionDuration: 3600
        AssumeRolePolicyDocument:
          Fn::Sub: |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": {
                    "Federated": "${self:custom.vercel_oidc_provider_arn}"
                  },
                  "Action": "sts:AssumeRoleWithWebIdentity",
                  "Condition": {
                    "StringEquals": {
                      "oidc.vercel.com/${self:custom.vercel_team_slug}:aud": "https://vercel.com/${self:custom.vercel_team_slug}",
                      "oidc.vercel.com/${self:custom.vercel_team_slug}:sub": [
                        "owner:${self:custom.vercel_team_slug}:project:${self:custom.vercel_project_name}:environment:${self:custom.vercel_environment}",
                        "owner:${self:custom.vercel_team_slug}:project:${self:custom.vercel_project_name}:environment:${self:custom.vercel_local_environment}"
                      ]
                    }
                  }
                }
              ]
            }
        Policies:
          - PolicyName: SurveyTableAccess
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: WriteContactDetails
                  Effect: Allow
                  Action:
                    - dynamodb:PutItem
                    - dynamodb:UpdateItem
                  Resource:
                    Fn::Sub: "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${self:custom.core_table_name}"

                - Sid: ReadWriteSurveyResponses
                  Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:PutItem
                    - dynamodb:UpdateItem
                    - dynamodb:Query
                    - dynamodb:Scan
                    - dynamodb:BatchGetItem
                  Resource:
                    - Fn::GetAtt:
                        - SurveyTable
                        - Arn
                    - Fn::Sub:
                        - "${TableArn}/index/*"
                        - TableArn:
                            Fn::GetAtt:
                              - SurveyTable
                              - Arn

  Outputs:
    SurveyTableName:
      Description: DynamoDB table used for survey responses.
      Value:
        Ref: SurveyTable

    SurveyApplicationRoleArn:
      Description: IAM role for the Vercel survey application.
      Value:
        Fn::GetAtt:
          - SurveyApplicationRole
          - Arn
